<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>憩点 · Nodals</title>
    <meta name="description" content="憩點是一個安靜的小空間，點頭、休息、把一切交給當下。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/style.css">
    <script src="/language.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="header-top">
        <div class="logo">N</div>
        <div class="language-switcher">
          <button
             class="lang-toggle"
             type="button"
             aria-label="选择网站语言"
             aria-expanded="false"
             aria-controls="language-menu"
          >
           <span class="current-language">简体中文</span>
           <span class="language-arrow" aria-hidden="true">▾</span>
         </button>

         <nav
           class="language-menu"
           id="language-menu"
           aria-label="选择语言"
           hidden
         >
           <a class="language-option" href="/en/">
             <span>English</span>
             <span class="language-check" aria-hidden="true">✓</span>
           </a>
           <a class="language-option" href="/zh-hans/" aria-current="page">
             <span>简体中文</span>
             <span class="language-check" aria-hidden="true">✓</span>
           </a>
           <a class="language-option" href="/zh-hant/">
             <span>繁體中文</span>
             <span class="language-check" aria-hidden="true">✓</span>
           </a>
         </nav>
       </div>

      </header>

      <div class="hero">
        <div class="brand-mark">🍜</div>
        <div class="intro-text">
          <p class="eyebrow">憩点 · Nodals</p>
          <h1>只需点头</h1>
          <p class="subtitle">我们会处理一切。</p>
        </div>
      </div>

      <main class="content-card">
        <section class="welcome">
          <h2>欢迎来到憩点。</h2>
          <p class="greeting">
            这里，是一个可以稍作休息的地方。
          </p>
          <p class="description">
            不必急着把所有事情做完，也不必时刻忙碌。累了，就停一停；想放空，就让思续暂时歇一歇。来一碗热腾腾的面，点点头，享受片刻的安宁。
          </p>
          <p class="conclusion">
            这里是憩点——让你暂时放下手边的事，好好喘口气。
          </p>
        </section>

        <section class="tags" aria-label="关键标签">
          <span>点头</span>
          <span>歇息</span>
          <span>热汤面</span>
          <span>片刻安宁</span>
          <span>重新起航</span>
        </section>

        <section class="links">
          <a href="https://github.com/ZuriDadada" target="_blank" rel="noreferrer">GitHub</a>
          <a href="mailto:zuridadada@outlook.com">寄信</a>
        </section>
      </main>

      <footer class="footer">
        <p>只需点头，我们会处理一切。</p>
        <div class="site-footer" aria-label="网页页尾">
          <span>与 Copilot、ChatGPT 共同打造</span>
          <span>•</span>
          <span>由 GitHub Pages 提供技术支持</span>
        </div>
      </footer>
    </div>
  </body>
</html>
