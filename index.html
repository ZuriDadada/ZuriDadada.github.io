
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Choose your language · Nodals</title>
  <meta name="description" content="Welcome to Nodals. Choose your language.">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-taipei-sans-tc@0.0.1/dist/index.css"
  >
  <link rel="stylesheet" href="/style.css">

  <script>
    try {
      const saved = localStorage.getItem("nodals-language");
      const destinations = {
        "zh-hans": "/zh-hans/",
        "zh-hant": "/zh-hant/",
        "en": "/en/"
      };

      if (destinations[saved]) {
        window.location.replace(destinations[saved]);
      }
    } catch (error) {
      // Storage unavailable: keep the language selector usable.
    }
  </script>

  <script src="/language.js" defer></script>
</head>

<body>
  <div class="page-shell">
    <header class="header-top">
      <a class="logo" href="/" aria-label="Nodals home">N</a>
      <span class="lang-toggle">NODALS</span>
    </header>

    <div class="hero">
      <div class="brand-mark" aria-hidden="true">🍜</div>

      <div class="intro-text">
        <p class="eyebrow">A LITTLE PLACE TO PAUSE</p>
        <h1>Welcome to Nodals.</h1>
        <p class="subtitle">
          Just nod all. We'll handle the rest.
        </p>
      </div>
    </div>

    <main class="content-card">
      <section class="welcome">
        <p class="greeting">Choose your language.</p>
        <p class="description">
          Take a little pause, find your way,
          and continue at your own pace.
        </p>
      </section>

      <nav class="links" aria-label="Choose your language">
        <a href="/zh-hans/" lang="zh-Hans">简体中文</a>
        <a href="/zh-hant/" lang="zh-Hant">繁體中文</a>
        <a href="/en/" lang="en">English</a>
      </nav>
    </main>

    <footer class="footer">
      <p>A little place to pause.</p>
      <div class="site-footer">
        <span>Nodals</span>
        <span>•</span>
        <span>Powered by GitHub Pages</span>
      </div>
    </footer>
  </div>
</body>
</html>
